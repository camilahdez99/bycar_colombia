# Suite completa del proyecto (ver CLAUDE.md): tests, build y lint.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Obligatorio desde que DT-38 lo dejó en verde (0 errores y 0 warnings)
      - name: Lint
        run: npm run lint
